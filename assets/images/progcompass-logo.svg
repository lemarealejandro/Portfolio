<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">ProgCompass</title>
  <desc id="desc">Minimalist compass symbol and ProgCompass wordmark.</desc>
  <defs>
    <linearGradient id="compassBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3185F4"/>
      <stop offset="52%" stop-color="#2454C5"/>
      <stop offset="100%" stop-color="#172D78"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#F7F8FA"/>

  <!-- App icon tile -->
  <rect x="245" y="145" width="710" height="710" rx="155" fill="url(#tile)"/>

  <!-- Compass orbit: intentionally open at the top-right -->
  <path d="M 492 497
           A 145 145 0 0 1 625 410"
        fill="none" stroke="url(#compassBlue)" stroke-width="31" stroke-linecap="round"/>
  <path d="M 690 456
           A 145 145 0 0 1 548 683"
        fill="none" stroke="url(#compassBlue)" stroke-width="31" stroke-linecap="round"/>

  <!-- Compass needle -->
  <path d="M 666 451
           L 624 563
           Q 620 574 610 581
           L 525 635
           Q 516 641 520 630
           L 562 522
           Q 566 512 576 505
           Z"
        fill="url(#compassBlue)"/>
  <circle cx="593" cy="550" r="17" fill="#FFFFFF"/>

  <!-- Companion dot -->
  <circle cx="690" cy="389" r="34" fill="url(#compassBlue)"/>

  <!-- Wordmark -->
  <text x="600" y="740" text-anchor="middle"
        font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="78" font-weight="500" letter-spacing="-3">
    <tspan fill="#101827">Prog</tspan><tspan fill="#2854BD">Compass</tspan>
  </text>
</svg>
